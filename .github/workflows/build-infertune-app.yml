name: Build InferTune

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["infertune-app/**", ".github/workflows/build-infertune-app.yml"]
  pull_request:
    paths: ["infertune-app/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: infertune-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infertune-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: infertune-app/src-tauri

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      # Tagged builds (v1.2.3) publish a draft GitHub release with the installer.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: infertune-app
          tagName: ${{ github.ref_name }}
          releaseName: InferTune ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # Other builds just prove the app compiles and upload the installer.
      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: infertune-windows-installer
          path: infertune-app/src-tauri/target/release/bundle/nsis/*.exe
